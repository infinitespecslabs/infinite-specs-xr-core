##
## libs.versions.toml
## Version catalog for infinite-specs-xr-core.
## Targets the Jetpack XR SDK 1.0 (Compose for XR 1.0 beta).
##

[versions]
# ── Kotlin ─────────────────────────────────────────────────────────────────
kotlin                    = "2.4.21"
kotlinxCoroutines         = "1.11.0"
kotlinxSerializationJson  = "1.13.0"

# ── Android build tooling ───────────────────────────────────────────────────
androidGradlePlugin       = "9.5.1"
compileSdk                = "36"
minSdk                    = "33"        # Android XR minimum
targetSdk                 = "36"

# ── AndroidX core ──────────────────────────────────────────────────────────
# coreKtx, lifecycle and composeBom are held at the newest releases that compile
# against API 36. core-ktx 1.19+, lifecycle 2.11+ and Compose 1.12+ (BOM 2026.08+)
# all require compileSdk 37.
coreKtx                   = "1.18.0"
lifecycle                 = "2.10.0"
activityCompose           = "1.13.0"
fragment                  = "1.9.1"       # constraint only, see app/build.gradle.kts

# ── Jetpack Compose ─────────────────────────────────────────────────────────
composeBom                = "2026.06.01"

# ── Jetpack XR SDK 1.0 (Compose for XR still beta) ─────────────────────────
xrRuntime                 = "1.0.0"
xrScenecore               = "1.0.0"
xrCompose                 = "1.0.0-beta02"
xrArcore                  = "1.0.0"

# ── Ktor (SSE transport) ────────────────────────────────────────────────────
ktor                      = "3.2.4"

# ── Test ────────────────────────────────────────────────────────────────────
junit                     = "4.13.2"
junitExt                  = "1.3.0"
mockk                     = "1.14.12"
turbine                   = "1.2.1"       # Flow testing

# ── Code Style ──────────────────────────────────────────────────────────────
spotless                  = "8.11.0"
ktlint                    = "1.8.0"

# ── AI (Gemini via Firebase AI Logic) ───────────────────────────────────────
firebaseBom               = "35.2.0"
googleServices            = "4.6.0"

# ── Code Coverage ───────────────────────────────────────────────────────────
kover                     = "0.9.11"


[libraries]
# ── Kotlin std / coroutines ─────────────────────────────────────────────────
kotlin-stdlib                     = { group = "org.jetbrains.kotlin",  name = "kotlin-stdlib",                       version.ref = "kotlin" }
kotlinx-coroutines-core           = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",             version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",          version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test           = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",             version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json        = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",          version.ref = "kotlinxSerializationJson" }

# ── AndroidX ────────────────────────────────────────────────────────────────
androidx-core-ktx                 = { group = "androidx.core",         name = "core-ktx",                            version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx    = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx",               version.ref = "lifecycle" }
androidx-activity-compose         = { group = "androidx.activity",     name = "activity-compose",                    version.ref = "activityCompose" }
androidx-fragment                 = { group = "androidx.fragment",     name = "fragment",                            version.ref = "fragment" }

# ── Jetpack Compose BOM + core ───────────────────────────────────────────────
androidx-compose-bom               = { group = "androidx.compose",     name = "compose-bom",                         version.ref = "composeBom" }
androidx-compose-ui                = { group = "androidx.compose.ui",  name = "ui" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",  name = "ui-tooling" }
androidx-compose-ui-tooling-preview= { group = "androidx.compose.ui",  name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3", name = "material3" }

# ── Jetpack XR SDK 1.0 (Compose for XR still beta) ─────────────────────────
androidx-xr-runtime                = { group = "androidx.xr.runtime",  name = "runtime",                             version.ref = "xrRuntime" }
androidx-xr-scenecore              = { group = "androidx.xr.scenecore", name = "scenecore",                           version.ref = "xrScenecore" }
androidx-xr-compose                = { group = "androidx.xr.compose",  name = "compose",                             version.ref = "xrCompose" }
androidx-xr-arcore                 = { group = "androidx.xr.arcore",   name = "arcore",                              version.ref = "xrArcore" }

# ── Ktor ────────────────────────────────────────────────────────────────────
ktor-bom                          = { group = "io.ktor",               name = "ktor-bom",                            version.ref = "ktor" }
ktor-serialization-json           = { group = "io.ktor",               name = "ktor-serialization-kotlinx-json",     version.ref = "ktor" }
ktor-client-core                  = { group = "io.ktor",               name = "ktor-client-core",                    version.ref = "ktor" }
ktor-client-cio                   = { group = "io.ktor",               name = "ktor-client-cio",                     version.ref = "ktor" }
ktor-client-contentnegotiation    = { group = "io.ktor",               name = "ktor-client-content-negotiation",     version.ref = "ktor" }
ktor-client-mock                  = { group = "io.ktor",               name = "ktor-client-mock",                    version.ref = "ktor" }

# ── AI ──────────────────────────────────────────────────────────────────────
firebase-bom                      = { group = "com.google.firebase",   name = "firebase-bom",                        version.ref = "firebaseBom" }
firebase-ai                       = { group = "com.google.firebase",   name = "firebase-ai" }

# ── Test ────────────────────────────────────────────────────────────────────
junit                             = { group = "junit",                 name = "junit",                               version.ref = "junit" }
androidx-junit-ext                = { group = "androidx.test.ext",     name = "junit",                               version.ref = "junitExt" }
mockk                             = { group = "io.mockk",              name = "mockk",                               version.ref = "mockk" }
turbine                           = { group = "app.cash.turbine",      name = "turbine",                             version.ref = "turbine" }

[plugins]
android-application   = { id = "com.android.application",          version.ref = "androidGradlePlugin" }
android-library       = { id = "com.android.library",              version.ref = "androidGradlePlugin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spotless              = { id = "com.diffplug.spotless",            version.ref = "spotless" }
kover                 = { id = "org.jetbrains.kotlinx.kover",      version.ref = "kover" }
google-services       = { id = "com.google.gms.google-services",   version.ref = "googleServices" }

