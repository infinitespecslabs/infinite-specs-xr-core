android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# Disable built-in Kotlin support in newer AGP to avoid conflicts with manual KGP
android.builtInKotlin=false
# The org.jetbrains.kotlin.android plugin still needs the legacy variant API; without this it fails to apply.
android.newDsl=false
# AGP 9.5 registers a Compose Preview task per variant that cannot be created when the
# variant's unit tests are disabled (the AGP 9 default for release), which breaks
# `./gradlew tasks --all`. Costs a second, release-variant unit test run in `:app:test`.
android.onlyEnableUnitTestForTheTestedBuildType=false
